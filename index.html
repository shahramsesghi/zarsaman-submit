  function normalizePrice(value, multiply = 1) {
    if (!value) return null;
    if (typeof value === "string") value = value.replace(/,/g, "").trim();
    const num = parseFloat(value);
    return isNaN(num) ? null : Math.round(num * multiply);
  }

  async function fetchWithRetry(url, options = {}, retries = 3) {
    for (let attempt = 0; attempt < retries; attempt++) {
      for (let i = 0; i < proxyList.length; i++) {
        try {
          const proxy = proxyList[i];
          const targetUrl = proxy ? proxy + encodeURIComponent(url) : url;
          const res = await fetch(targetUrl, {
            ...options,
            headers: {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              ...(options.headers || {})
            }
          });
          if (res.ok) return res;
          if (res.status === 403 || res.status === 429) continue;
        } catch (e) {}
        await new Promise(r => setTimeout(r, 200));
      }
      if (attempt < retries - 1) await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
    }
    return null;
  }

  function getCachedPrice(name) {
    const cached = localStorage.getItem(`cache_${name}`);
    if (cached) {
      const { data, timestamp } = JSON.parse(cached);
      if (Date.now() - timestamp < 30000) return data;
    }
    return null;
  }

  function setCachedPrice(name, data) {
    localStorage.setItem(`cache_${name}`, JSON.stringify({ data, timestamp: Date.now() }));
  }

  // لایه نهایی نرمال‌سازی: همیشه فروش > خرید
  function normalizeBuySell(rawBuy, rawSell) {
    if (rawBuy == null || rawSell == null) return { buy: null, sell: null };
    const b = Number(rawBuy);
    const s = Number(rawSell);
    if (isNaN(b) || isNaN(s)) return { buy: null, sell: null };
    return {
      buy: Math.min(b, s),   // خرید = کوچکتر
      sell: Math.max(b, s)   // فروش = بزرگتر
    };
  }

  async function sendToDestination(id, buy, sell) {
    try {
      const body = new URLSearchParams({ company_id: id, buy, sell, token, api_key: apiKey }).toString();
      const res = await fetch("https://zarsaman.ir/admin/zar.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded", "X-Secure-Key": apiKey },
        body
      });
      const text = await res.text();
      try { return JSON.parse(text); } catch { return text; }
    } catch { return { status: 'error', message: 'خطای شبکه' }; }
  }

  function logResult(site, buy, sell, resp) {
    const tbody = document.querySelector("#logTable tbody");
    const tr = document.createElement("tr");
    const now = new Date().toLocaleString('fa-IR');
    let cls = 'error', msg = 'خطا';
    if (resp?.status === 'success') { cls = 'success'; msg = resp.message || 'موفق'; }
    else if (resp?.skipped) { cls = 'warning'; msg = 'تکراری'; }
    else if (typeof resp === 'string') msg = resp;
    tr.innerHTML = `<td>${now}</td><td><strong>${site}</strong></td>
      <td class="font-mono">${buy ? buy.toLocaleString('fa-IR') : "-"}</td>
      <td class="font-mono">${sell ? sell.toLocaleString('fa-IR') : "-"}</td>
      <td class="${cls}">${msg}</td>`;
    tbody.prepend(tr);
  }

  async function runTask() {
    for (const api of apis) {
      const data = await api.fetchData();
      if (data && data.buy !== undefined && data.sell !== undefined && data.buy !== null && data.sell !== null) {
        const normalized = normalizeBuySell(data.buy, data.sell);
        const resp = await sendToDestination(api.company_id, normalized.buy, normalized.sell);
        logResult(api.name, normalized.buy, normalized.sell, resp);
      } else {
        logResult(api.name, null, null, "دریافت قیمت ناموفق");
      }
      await new Promise(r => setTimeout(r, 500));
    }
  }

  runTask();
  setInterval(runTask, 60000);
