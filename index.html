  let currentProxyIndex = 0;

  function normalizePrice(value, multiply = 1) {
    if (!value) return null;
    if (typeof value === "string") value = value.replace(/,/g, "").trim();
    const num = parseFloat(value);
    return isNaN(num) ? null : Math.round(num * multiply);
  }

  async function fetchWithRetry(url, options = {}, retries = 3) {
    let lastError = null;
    for (let attempt = 0; attempt < retries; attempt++) {
      for (let i = 0; i < proxyList.length; i++) {
        try {
          const proxy = proxyList[i];
          const targetUrl = proxy ? proxy + encodeURIComponent(url) : url;
          const res = await fetch(targetUrl, {
            ...options,
            headers: {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              ...(options.headers || {})
            }
          });
          if (res.ok) {
            if (i !== currentProxyIndex) currentProxyIndex = i;
            return res;
          }
          if (res.status === 403 || res.status === 429) continue;
        } catch (e) {
          lastError = e;
        }
        await new Promise(r => setTimeout(r, 200));
      }
      if (attempt < retries - 1) await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
    }
    return null;
  }

  function getCachedPrice(name) {
    const cached = localStorage.getItem(`cache_${name}`);
    if (cached) {
      const { data, timestamp } = JSON.parse(cached);
      if (Date.now() - timestamp < 30000) return data;
    }
    return null;
  }

  async function sendToDestination(company_id, buy, sell) {
    try {
      const body = new URLSearchParams({
        company_id, buy, sell, token, api_key: apiKey
      }).toString();

      const response = await fetch("https://zarsaman.ir/admin/zar.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "X-Secure-Key": apiKey
        },
        body
      });

      const text = await response.text();
      try { return JSON.parse(text); } catch { return text; }
    } catch (err) {
      return { status: 'error', message: 'خطای شبکه: ' + err.message };
    }
  }

  function logResult(site, buy, sell, response) {
    const tbody = document.querySelector("#logTable tbody");
    const tr = document.createElement("tr");
    const now = new Date().toLocaleString('fa-IR');

    let statusClass = 'error';
    let details = 'خطا';

    if (response?.status === 'success') { statusClass = 'success'; details = response.message || 'موفق'; }
    else if (response?.skipped) { statusClass = 'warning'; details = 'تکراری'; }
    else if (typeof response === 'string') details = response;

    tr.innerHTML = `
      <td>${now}</td>
      <td><strong>${site}</strong></td>
      <td class="font-mono">${buy ? buy.toLocaleString('fa-IR') : "-"}</td>
      <td class="font-mono">${sell ? sell.toLocaleString('fa-IR') : "-"}</td>
      <td class="${statusClass}">${details}</td>
    `;
    tbody.prepend(tr);
  }

  async function runTask() {
    let success = 0, error = 0;
    for (const api of apis) {
      const result = await api.fetchData();
      if (result && result.buy && result.sell) {
        const resp = await sendToDestination(api.company_id, result.buy, result.sell);
        logResult(api.name, result.buy, result.sell, resp);
        resp?.status === 'success' ? success++ : error++;
      } else {
        logResult(api.name, null, null, "دریافت قیمت ناموفق");
        error++;
      }
      await new Promise(r => setTimeout(r, 500));
    }
