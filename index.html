  function normalizePrice(value, multiply = 1) {
    if (value === null || value === undefined) return null;
    if (typeof value === "string") value = value.replace(/,/g, "").trim();
    const num = parseFloat(value);
    return isNaN(num) ? null : Math.round(num * multiply);
  }

  // 🔄 تابع fetch بهبود یافته با تعویض خودکار Proxy
  async function fetchWithRetry(url, options = {}, retries = 3) {
    let lastError = null;
    
    // برای هر تلاش
    for (let attempt = 0; attempt < retries; attempt++) {
      // برای هر پروکسی در لیست
      for (let proxyIndex = 0; proxyIndex < proxyList.length; proxyIndex++) {
        try {
          const proxy = proxyList[proxyIndex];
          const targetUrl = proxy ? proxy + encodeURIComponent(url) : url;
          
          // لاگ فقط برای اولین تلاش
          if (attempt === 0 && proxyIndex === 0) {
            console.log(`🌐 درخواست: ${url.substring(0, 50)}...`);
          }
          
          const res = await fetch(targetUrl, {
            ...options,
            headers: {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              ...(options.headers || {})
            }
          });
          
          // اگر موفق بود
          if (res.ok) {
            if (proxyIndex !== currentProxyIndex) {
              currentProxyIndex = proxyIndex;
              proxyUrl = proxyList[proxyIndex];
              console.log(`🔄 Proxy تغییر کرد به: شاخص ${proxyIndex + 1} (${proxy || 'مستقیم'})`);
            }
            return res;
          }
          
          // اگر خطای 403 یا 429 (Rate Limit یا مسدود شده)
          if (res.status === 403 || res.status === 429) {
            console.warn(`⚠️ Proxy ${proxyIndex + 1} خطا ${res.status}، تست پروکسی بعدی...`);
            continue; // به Proxy بعدی برو
          }
          
          // برای سایر خطاها هم به پروکسی بعدی برو
          console.warn(`⚠️ Proxy ${proxyIndex + 1} خطا ${res.status}`);
          continue;
          
        } catch (e) {
          lastError = e;
          console.warn(`❌ Proxy ${proxyIndex + 1} شکست:`, e.message);
        }
        
        // کمی صبر بین پروکسی‌ها (۲۰۰ میلی‌ثانیه)
        await new Promise(resolve => setTimeout(resolve, 200));
      }
      
      // بین تلاش‌های اصلی بیشتر صبر کن
      if (attempt < retries - 1) {
        const waitTime = 1000 * (attempt + 1);
        console.log(`🕒 انتظار ${waitTime/1000} ثانیه قبل از تلاش مجدد...`);
        await new Promise(resolve => setTimeout(resolve, waitTime));
      }
    }
    
    console.error('💥 همه Proxyها شکست خوردند. آخرین خطا:', lastError?.message || 'ناشناخته');
    return null;
  }

  // 🔒 نسخه امن‌سازی شده تابع ارسال با دیباگ کامل
  async function sendToDestination(company_id, buy, sell, token) {
    try {
      console.log('🔍 ارسال به سرور:', { 
        company_id, 
        buy: buy?.toLocaleString('fa-IR'), 
        sell: sell?.toLocaleString('fa-IR'),
        timestamp: new Date().toLocaleTimeString('fa-IR')
      });
      
      const requestBody = new URLSearchParams({ 
        company_id, 
        buy, 
        sell, 
        token,
        api_key: apiKey // 🔒 اضافه کردن کلید امنیتی جدید
      }).toString();
      
      console.log('📤 درخواست POST:', requestBody.substring(0, 100) + '...');
      
      const response = await fetch("https://zarsaman.ir/admin/zar.php", {
        method: "POST",
        headers: { 
          "Content-Type": "application/x-www-form-urlencoded",
          "X-Secure-Key": apiKey // اضافه کردن هدر امنیتی
        },
        body: requestBody
      });
      
      console.log('📥 پاسخ سرور:', {
        status: response.status,
        statusText: response.statusText,
        ok: response.ok,
        type: response.type,
        url: response.url
      });
      
      const text = await response.text();
      console.log('📄 متن پاسخ:', text.substring(0, 200) + (text.length > 200 ? '...' : ''));
      
      try {
        const parsed = JSON.parse(text);
        console.log('✅ پاسخ پارس شده:', parsed);
        return parsed;
      } catch (jsonError) {
        console.warn('⚠️ پاسخ JSON نیست:', text);
        return text;
      }
    } catch (err) {
      console.error('❌ خطای fetch:', {
        name: err.name,
        message: err.message,
        stack: err.stack?.split('\n')[0]
      });
      return { 
        status: 'error', 
        message: 'خطای شبکه: ' + err.message 
      };
    }
  }

  function logResult(site, buy, sell, response) {
    const tbody = document.querySelector("#logTable tbody");
    const tr = document.createElement("tr");
    const now = new Date().toLocaleString('fa-IR');
    
    let status = 'نامشخص';
    let statusClass = 'error';
    let details = '';
    
    if (response?.status === 'success') {
      status = 'موفق';
      statusClass = 'success';
      details = response.message || 'ذخیره شد';
    } else if (response?.skipped) {
      status = 'تکراری';
      statusClass = 'warning';
      details = response.message || 'رد شد';
    } else if (response?.status === 'error') {
      status = 'خطا';
      statusClass = 'error';
      details = response.message || 'خطای سرور';
    } else if (typeof response === 'string') {
      status = 'خطا';
      details = response;
    } else if (response?.message) {
      status = 'خطا';
      details = response.message;
    }
    
    // اضافه کردن اطلاعات دیباگ
    if (response && response.status !== 'success') {
      details += ` (کد: ${response.status || 'N/A'})`;
    }
    
    tr.innerHTML = `
      <td>${now}</td>
      <td><strong>${site}</strong></td>
      <td class="font-mono">${buy ? buy.toLocaleString('fa-IR') : "-"}</td>
      <td class="font-mono">${sell ? sell.toLocaleString('fa-IR') : "-"}</td>
      <td class="${statusClass}">${details}</td>
    `;
    tbody.prepend(tr);
    
    // اگر خطای ۴۰۳ یا ۴۰۱ بود، پیام هشدار اضافه کن
    if (response?.status === 403 || response?.status === 401 || 
      details?.includes('دسترسی') || details?.includes('توکن')) {
      const warningRow = document.createElement('tr');
      warningRow.innerHTML = `
        <td colspan="5" class="warning text-center bg-yellow-50">
          ⚠️ هشدار امنیتی: ${details}. لطفا از 
          <a href="https://github.com/shahramsesghi/zarsaman-submit" target="_blank" class="underline">
            GitHub
          </a> 
          فایل submit را آپدیت کنید.
        </td>
      `;
      tbody.prepend(warningRow);
    }
  }

  async function runTask() {
    console.log('🚀 شروع ارسال خودکار قیمت‌ها از Vercel...');
    console.log('🔑 توکن‌ها:', { 
      token: token.substring(0, 10) + '...',
      apiKey: apiKey.substring(0, 15) + '...',
      origin: window.location.origin
    });
    
    let successCount = 0;
    let errorCount = 0;
    
    for (let i = 0; i < apis.length; i++) {
      const api = apis[i];
      console.log(`\n🔄 پردازش ${i+1}/${apis.length}: ${api.name}`);
      
      const result = await api.fetchData();
      if (result) {
        console.log(`📊 داده دریافت شد: خرید=${result.buy?.toLocaleString('fa-IR')}, فروش=${result.sell?.toLocaleString('fa-IR')}`);
        const response = await sendToDestination(api.company_id, result.buy, result.sell, token);
        logResult(api.name, result.buy, result.sell, response);
        
        // آمار
        if (response?.status === 'success') {
          successCount++;
        } else {
          errorCount++;
        }
        
        // اگر خطای امنیتی داریم، متوقف شو
        if (response?.status === 403 || response?.status === 401) {
          console.error(`⛔ توقف ارسال: خطای امنیتی برای ${api.name}`);
          logResult("سیستم", null, null, { 
            status: 'error', 
            message: `⛔ ارسال متوقف شد: خطای امنیتی (${response.message || 'دسترسی غیرمجاز'})` 
          });
          break;
        }
      } else {
        console.warn(`⚠️ داده دریافت نشد: ${api.name}`);
        logResult(api.name, null, null, "خطا در دریافت داده از سایت مرجع");
        errorCount++;
      }
      
      // تاخیر ۵۰۰ms بین درخواست‌ها
      await new Promise(resolve => setTimeout(resolve, 500));
    }
    
    // خلاصه اجرا
    console.log(`\n📈 خلاصه اجرا: ${successCount} موفق، ${errorCount} خطا`);
    if (errorCount > 0) {
      logResult("خلاصه", null, null, { 
        status: 'warning', 
        message: `✅ اجرا کامل: ${successCount} موفق، ${errorCount} خطا` 
      });
    }
  }

  // اجرای اولیه
  console.log('🏁 شروع برنامه submit...');
  runTask().catch(err => {
    console.error('💥 خطای کلی در runTask:', err);
    logResult("سیستم", null, null, { 
      status: 'error', 
      message: 'خطای سیستمی: ' + err.message 
    });
  });

  // اجرای خودکار هر 30 6انیه

    console.log('\n🔄 رفرش خودکار...');
    runTask().catch(err => {
      console.error('💥 خطای رفرش:', err);
    });
  }, 30000);
