{
  name: "panahcoin.com",
  company_id: 33,
  async fetchData() {
    try {
      const targetUrl = "https://www.panahcoin.com/rates/";
      const res = await fetch(proxyUrl + encodeURIComponent(targetUrl));
      if (!res.ok) throw new Error(`panahcoin: HTTP ${res.status} - ${res.statusText}`);

      const html = await res.text();

      // 1️⃣ پیدا کردن ردیف طلای ۱۸ عیار (regex مقاوم‌تر با فاصله‌های اختیاری)
      const rowMatch = html.match(
        /<td[^>]*>\s*طلای\s*(?:18|هجده)\s*عیار\s*<\/td>[\s\S]*?<\/tr>/i
      );

      if (!rowMatch) {
        console.warn("panahcoin: ردیف 'طلای ۱۸ عیار' پیدا نشد");
        console.log("HTML snippet (اول ۲۰۰۰ کاراکتر):", html.substring(0, 2000)); // برای دیباگ
        return null;
      }

      const rowHtml = rowMatch[0];

      // 2️⃣ استخراج تمام قیمت‌ها از ردیف (معمولاً خرید و فروش)
      const priceMatches = rowHtml.matchAll(/shortcode_price'?>\s*([\d,]+)\s*</g);
      const prices = Array.from(priceMatches, m => m[1]);

      if (prices.length < 2) {
        console.warn("panahcoin: تعداد قیمت‌ها کمتر از ۲ تا است");
        console.log("قیمت‌های استخراج‌شده:", prices);
        return null;
      }

      // فرض: اولین قیمت = خرید، دومین = فروش (اگر ترتیب برعکس بود، عوض کن)
      const buyToman  = Number(prices[0].replace(/,/g, ""));
      const sellToman = Number(prices[1].replace(/,/g, ""));

      // 3️⃣ اعتبارسنجی حرفه‌ای بازار طلا
      if (
        isNaN(buyToman) || isNaN(sellToman) ||
        buyToman <= 0 || sellToman <= 0 ||
        buyToman > sellToman || // خرید نباید بیشتر از فروش باشه
        sellToman > buyToman * 1.1 // اختلاف بیش از ۱۰٪ غیرعادی
      ) {
        console.warn(`panahcoin: قیمت نامعتبر - خرید: ${buyToman}, فروش: ${sellToman}`);
        return null;
      }

      // 4️⃣ تبدیل به ریال (×10) + گرد کردن
      const buyRial  = Math.round(buyToman * 10);
      const sellRial = Math.round(sellToman * 10);

      return {
        buy: buyRial,
        sell: sellRial
      };
    } catch (e) {
      console.error("panahcoin fetch error:", e.message || e);
      return null;
    }
  }
},

  ];

  async function sendToDestination(company_id, buy, sell, token) {
    try {
      const res = await fetch("https://zarsaman.ir/admin/zar.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ company_id, buy, sell, token })
      });
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        return text;
      }
    } catch (err) {
      return "خطا در ارسال: " + err.message;
    }
  }

  function logResult(site, buy, sell, response) {
    const tbody = document.querySelector("#logTable tbody");
    const tr = document.createElement("tr");
    const now = new Date().toLocaleString('fa-IR');
    const status = response?.status === 'success' ? 'success' : 'error';
    tr.innerHTML = `
      <td>${now}</td>
      <td>${site}</td>
      <td>${buy ? buy.toLocaleString('fa-IR') : "-"}</td>
      <td>${sell ? sell.toLocaleString('fa-IR') : "-"}</td>
      <td class="${status}">${response?.message || response || 'نامشخص'}</td>
    `;
    tbody.prepend(tr);
  }

  async function runTask() {
    for (let api of apis) {
      const result = await api.fetchData();
      if (result) {
        const response = await sendToDestination(api.company_id, result.buy, result.sell, token);
        logResult(api.name, result.buy, result.sell, response);
      } else {
        logResult(api.name, null, null, "خطا در دریافت داده");
      }
    }
  }

  // اجرای اولیه و تکرار هر ۶۰ ثانیه
  runTask();
  setInterval(runTask, 60000);
</script>
