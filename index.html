const proxyList = [
  'https://api.codetabs.com/v1/proxy/?quest=',
  'https://corsproxy.org/?',
  'https://api.allorigins.win/raw?url=',
  'https://cors-anywhere.herokuapp.com/',
  ''
];
let currentProxyIndex = 0;
let proxyUrl = proxyList[currentProxyIndex];

function normalizePrice(value, multiply = 1) {
  if (value === null || value === undefined) return null;
  if (typeof value === "string") value = value.replace(/,/g, "").trim();
  const num = parseFloat(value);
  return isNaN(num) ? null : Math.round(num * multiply);
}

async function fetchWithRetry(url, options = {}, retries = 3) {
  let lastError = null;
  for (let attempt = 0; attempt < retries; attempt++) {
    for (let proxyIndex = 0; proxyIndex < proxyList.length; proxyIndex++) {
      try {
        const proxy = proxyList[proxyIndex];
        const targetUrl = proxy ? proxy + encodeURIComponent(url) : url;
        const res = await fetch(targetUrl, { ...options, headers: { 'User-Agent': 'Mozilla/5.0', ...(options.headers||{}) }});
        if (res.ok) {
          if (proxyIndex !== currentProxyIndex) {
            currentProxyIndex = proxyIndex;
            proxyUrl = proxyList[proxyIndex];
          }
          return res;
        }
      } catch(e) { lastError = e; }
      await new Promise(r => setTimeout(r, 200));
    }
    if (attempt < retries-1) await new Promise(r => setTimeout(r, 1000*(attempt+1)));
  }
  console.error('همه Proxyها شکست خوردند.', lastError);
  return null;
}

function getCachedPrice(site) {
  const cached = localStorage.getItem(`cache_${site}`);
  if (!cached) return null;
  const { data, timestamp } = JSON.parse(cached);
  return Date.now() - timestamp < 30000 ? data : null;
}
function setCachedPrice(site, data) {
  localStorage.setItem(`cache_${site}`, JSON.stringify({ data, timestamp: Date.now() }));
}

function logResult(site, buy, sell, status) {
  const tbody = document.querySelector('#logTable tbody');
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${new Date().toLocaleTimeString()}</td>
                  <td>${site}</td>
                  <td>${buy !== null ? buy.toLocaleString() : '-'}</td>
                  <td>${sell !== null ? sell.toLocaleString() : '-'}</td>
                  <td>${status}</td>`;
  tbody.prepend(tr);
}
