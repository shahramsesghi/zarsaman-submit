    return isNaN(num) ? null : Math.round(num);
  }

  async function fetchWithRetry(url, options = {}, retries = 3) {
    let lastError = null;
    for (let attempt = 0; attempt < retries; attempt++) {
      for (let proxyIndex = 0; proxyIndex < proxyList.length; proxyIndex++) {
        try {
          const proxy = proxyList[proxyIndex];
          const targetUrl = proxy ? proxy + encodeURIComponent(url) : url;
          if (attempt === 0 && proxyIndex === 0) {
            console.log(`🌐 درخواست: ${url.substring(0, 60)}...`);
          }
          const res = await fetch(targetUrl, {
            ...options,
            headers: {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              ...(options.headers || {})
            }
          });
          if (res.ok) {
            if (proxyIndex !== currentProxyIndex) {
              currentProxyIndex = proxyIndex;
              console.log(`🔄 Proxy تغییر کرد به: ${proxy || 'مستقیم'}`);
            }
            return res;
          }
        } catch (e) {
          lastError = e;
        }
        await new Promise(r => setTimeout(r, 200));
      }
      if (attempt < retries - 1) {
        await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
      }
    }
    console.error('💥 همه Proxyها شکست خوردند:', lastError?.message);

  }

  async function sendToDestination(company_id, buy, sell) {
    try {
      const body = new URLSearchParams({ company_id, buy, sell, token, api_key: apiKey }).toString();
      const response = await fetch("https://zarsaman.ir/admin/zar.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "X-Secure-Key": apiKey
        },
        body
      });
      const text = await response.text();
      try { return JSON.parse(text); } catch { return text; }
    } catch (err) {
      return { status: 'error', message: err.message };
    }
  }

  function logResult(site, buy, sell, response) {
    const tbody = document.querySelector("#logTable tbody");
    const tr = document.createElement("tr");
    const now = new Date().toLocaleString('fa-IR');
    let details = '', cls = 'error';
    if (response?.status === 'success') {
      details = response.message || 'ذخیره شد';
      cls = response.skipped ? 'warning' : 'success';
    } else {
      details = response?.message || response || 'خطا';
    }
    tr.innerHTML = `
      <td>${now}</td>
      <td><strong>${site}</strong></td>
      <td class="font-mono">${buy ? buy.toLocaleString('fa-IR') : "-"}</td>
      <td class="font-mono">${sell ? sell.toLocaleString('fa-IR') : "-"}</td>
      <td class="${cls}">${details}</td>
    `;
    tbody.prepend(tr);
  }

  async function runTask() {
    console.log('🚀 شروع دور جدید ارسال قیمت‌ها...');
    let ok = 0, err = 0;

    for (const api of apis) {
      console.log(`🔄 ${api.name}`);
      const result = await api.fetchData();

      if (result) {
        const response = await sendToDestination(api.company_id, result.buy, result.sell);
        logResult(api.name, result.buy, result.sell, response);
        if (response?.status === 'success') ok++; else err++;
      } else {
        logResult(api.name, null, null, "خطا در دریافت داده");
        err++;
      }

      // فاصله بین هر سایت: حدود ۰٫۸ ثانیه
      await new Promise(r => setTimeout(r, 800));
    }

    console.log(`📈 خلاصه دور: ${ok} موفق، ${err} خطا`);
  }
